name: alphabet_adventure
description: "Alphabet Adventure 3D — An interactive educational game for children aged 4–8."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & DI
  provider: ^6.1.2

  # Routing
  go_router: ^14.8.1

  # Local storage
  shared_preferences: ^2.5.3

  # Audio
  audioplayers: ^6.4.0

  # Animations
  flutter_animate: ^4.5.2

  # Unique IDs
  uuid: ^4.5.1
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    # Fredoka's licence, surfaced through LicenseRegistry. The .ttf files below
    # are declared under `fonts:` and must not also be listed here, or their
    # bytes would be bundled twice.
    - assets/fonts/OFL.txt
    - assets/audio/letters/
    - assets/audio/words/
    - assets/audio/phonics/
    - assets/audio/mascot/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/images/avatars/
    - assets/images/ui/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/ui/app_icon.png
  adaptive_icon_background: "#FF6B6B"
  adaptive_icon_foreground: assets/images/ui/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#FF6B6B"
  image: assets/images/ui/splash_icon.png
  android_12:
    color: "#FF6B6B"
    image: assets/images/ui/splash_icon_android12.png
  ios: true
