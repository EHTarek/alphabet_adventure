name: alphabet_adventure
description: "Letterlands 3D — An interactive educational game for children aged 4–8."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & DI
  provider: ^6.1.2

  # Routing
  go_router: ^14.8.1

  # Local storage
  shared_preferences: ^2.5.3

  # Audio
  audioplayers: ^6.4.0

  # Typography
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.2

  # Unique IDs
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/audio/letters/
    - assets/audio/words/
    - assets/audio/phonics/
    - assets/audio/mascot/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/images/objects/
    - assets/images/worlds/
    - assets/images/mascot/
    - assets/images/avatars/
    - assets/images/ui/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/ui/app_icon.png
  adaptive_icon_background: "#FF6B6B"
  adaptive_icon_foreground: assets/images/ui/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFF7D6"
  image: assets/images/ui/app_icon.png
  android_12:
    color: "#FFF7D6"
    image: assets/images/ui/app_icon_foreground.png
    icon_background_color: "#FF6B6B"
  ios: true
